apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-k8s-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-k8s-app
  template:
    metadata:
      labels:
        app: my-k8s-app
    spec:
      containers:
       - name: ramya-api-container
         image: ramya-api:v5
         imagePullPolicy: Always
         ports:
            - containerPort: 8080
         resources:
           requests:
             cpu: "100m"
             memory: "128Mi"
           limits:
             cpu: "250m"
             memory: "256Mi"
         readinessProbe:
           httpGet:
             path: /
             port: 8080
           initialDelaySeconds: 5
           periodSeconds: 10
         livenessProbe:
           httpGet:
             path: /
             port: 8080
           initialDelaySeconds: 15
           periodSeconds: 20
