---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-k8s-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-k8s-app
  template:
    metadata:
      labels:
        app: my-k8s-app
    spec:
      containers:
       - name: ramya-api-container
         image: ramya-api:v5
         imagePullPolicy:
         ports:
            - containerPort: 8080
